.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}

.item summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"+";font-weight:400;font-size:1.3rem;line-height:1;color:var(--sea)}
.item[open] summary::after{content:"–"}
.body{padding:0 16px 16px;white-space:pre-line}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:10px 14px;border-radius:10px;border:2px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer;text-decoration:none;display:inline-block}
.btn.main{background:var(--sun);border-color:var(--sun);color:#12303A}
.btn.done{border-color:var(--ok);color:var(--ok)}
table{width:100%;border-collapse:collapse;margin-top:6px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600;font-size:.9rem}
.todo{color:var(--mute);font-style:italic}
.empty{color:var(--mute);padding:20px 0}
footer{color:var(--mute);font-size:.85rem;margin-top:24px}

var tab = "Todos", q = "";
var tabsEl = document.getElementById("tabs"), listEl = document.getElementById("list");
document.getElementById("foot").textContent = "Atualizado em " + UPDATED + ". Dúvida que não está aqui? Fale com a operação.";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function plain(it){return (it.t+" "+(it.b||"")+" "+(it.table?it.table.join(" "):"")).toLowerCase()}

function drawTabs(){
  tabsEl.innerHTML = "";
  ["Todos"].concat(Object.keys(DATA)).forEach(function(n){
    var b = document.createElement("button");
    b.className = "tab"; b.textContent = n; b.setAttribute("aria-pressed", n===tab);
    b.onclick = function(){tab = n; drawTabs(); draw()};
    tabsEl.appendChild(b);
  });
}

function draw(){
  var html = "", count = 0;
  Object.keys(DATA).forEach(function(cat){
    if(tab!=="Todos" && tab!==cat) return;
    if(cat==="Motoristas" && tab!=="Motoristas") return;
    DATA[cat].forEach(function(it, i){
      if(q && plain(it).indexOf(q)<0) return;
      count++;
      var body = "";
      if(it.b) body += '<div class="body-text'+(it.b.indexOf("PREENCHER")>-1?' todo':'')+'">'+esc(it.b)+'</div>';
      if(it.table){
        body += "<table>"+it.table.map(function(r,ri){return "<tr>"+r.map(function(c){return ri?"<td>"+esc(c)+"</td>":"<th>"+esc(c)+"</th>"}).join("")+"</tr>"}).join("")+"</table>";
      }
      var btns = "";
      if(it.link) btns += '<a class="btn main" target="_blank" rel="noopener" href="'+esc(it.link)+'">'+esc(it.linkTxt||"Abrir")+'</a>';
      if(it.copy) btns += '<button class="btn" data-copy="'+esc(it.copy)+'">Copiar</button>';
      html += '<details class="item"'+(q?' open':'')+'><summary>'+esc(it.t)+'</summary><div class="body">'+body+(btns?'<div class="btns">'+btns+'</div>':'')+'</div></details>';
    });
  });
  listEl.innerHTML = html || '<p class="empty">Nada encontrado. Tente outra palavra ou fale com a operação.</p>';
}

listEl.addEventListener("click", function(e){
  var b = e.target.closest("[data-copy]"); if(!b) return;
  var txt = b.getAttribute("data-copy");
  var ok = function(){b.textContent = "Copiado!"; b.classList.add("done"); setTimeout(function(){b.textContent="Copiar"; b.classList.remove("done")},1500)};
  try{ navigator.clipboard.writeText(txt).then(ok, fallback) }catch(x){ fallback() }
  function fallback(){var t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(x){}document.body.removeChild(t)}
});
document.getElementById("q").addEventListener("input", function(e){q = e.target.value.trim().toLowerCase(); draw()});
drawTabs(); draw();
